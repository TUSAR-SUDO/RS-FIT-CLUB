<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050506" />
    <meta name="color-scheme" content="dark" />

    <title>RS Fit Club — Gym in Samantarapur, Bhubaneswar</title>
    <meta
      name="description"
      content="RS Fit Club, Mahavir Bazar, Samantarapur, Bhubaneswar. Weight training, strength, cardio, Zumba, aerobics, personal training and diet planning with a team of coaches and nutritionists. Claim a free trial."
    />
    <link rel="canonical" href="https://rsfitclub.in/" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RS Fit Club" />
    <meta property="og:title" content="RS Fit Club — Gym in Samantarapur, Bhubaneswar" />
    <meta
      property="og:description"
      content="Weight training, cardio, Zumba and diet planning in Mahavir Bazar, Bhubaneswar. First session is on us."
    />
    <meta property="og:image" content="/og-cover.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-cover.png" />

    <!-- The founder cutout is the LCP element on phones, so it is fetched with
         the document rather than discovered after the CSS and JS have loaded.
         These are the stable /media paths written by scripts/build_assets.py;
         `imagesrcset` and `imagesizes` must stay byte-identical to the
         corresponding attributes on the hero <img> in OwnerFigure.tsx, or the
         preload is wasted and the image is fetched twice. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/media/owner-800.avif"
      imagesrcset="/media/owner-480.avif 480w, /media/owner-800.avif 800w, /media/owner-1200.avif 1200w, /media/owner-1600.avif 1600w"
      imagesizes="(max-width: 767px) 78vw, (max-width: 1023px) 52vw, 44vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
